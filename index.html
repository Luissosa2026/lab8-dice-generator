<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Generator</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <main>
        <h1>Dice Generator</h1>
        <p>Choose any two dice from D2–D20, then roll!</p>
    <section id="dice-selection">
    <h2>Choose your dice</h2>

    <div>
        <label for="dice1">Die 1 sides (2–20):</label>
        <input type="number" id="dice1" min="2" max="20" step="1" value="6">
    </div>

    <div>
        <label for="dice2">Die 2 sides (2–20):</label>
        <input type="number" id="dice2" min="2" max="20" step="1" value="6">
    </div>

    <button type="button" id="roll-button">Roll</button>
</section>
<section id="dice-results" hidden>
    <h2>Your results</h2>

    <p>Die 1: <span id="result1">—</span></p>
    <p>Die 2: <span id="result2">—</span></p>
    <p>Total: <span id="result-total">—</span></p>

    <button type="button" id="start-over-button">Start Over</button>
</section>
    </main>
</body>
</html>
